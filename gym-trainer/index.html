<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spotter Gym Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="3D virtual personal trainer for the machines and free weights in a Basic-Fit style gym.">
<meta name="theme-color" content="#0f1318">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Spotter</span></div>
    <span class="sync" id="sync" title="Where your data is saved">Saved on this device</span>
  </header>
  <main class="views">
    <section class="view" id="view-today" aria-label="Today"></section>
    <section class="view" id="view-library" aria-label="Library" hidden></section>
    <section class="view" id="view-program" aria-label="Program" hidden></section>
    <section class="view" id="view-progress" aria-label="Progress" hidden></section>
    <section class="view" id="view-coach" aria-label="Coach" hidden></section>
  </main>
  <nav class="tabbar" aria-label="Sections">
    <button class="tab is-on" data-tab="today"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>Today</span></button>
    <button class="tab" data-tab="library"><svg viewBox="0 0 24 24"><path d="M3 10h2V7h3v10H5v-3H3zm18 0h-2V7h-3v10h3v-3h2zM8 11h8v2H8z"/></svg><span>Library</span></button>
    <button class="tab" data-tab="program"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 7h6M9 11h6M9 15h4" fill="none" stroke-width="2"/></svg><span>Program</span></button>
    <button class="tab" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 19l5-6 4 3 7-9" fill="none" stroke-width="2.2"/></svg><span>Progress</span></button>
    <button class="tab" data-tab="coach"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Coach</span></button>
  </nav>
</div>

<div class="overlay" id="detail" hidden></div>
<div class="overlay" id="workout" hidden></div>
<div class="overlay" id="wizard" hidden></div>
<div class="sheet-wrap" id="sheet" hidden><div class="sheet-scrim" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
